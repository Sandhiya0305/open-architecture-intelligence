name: Daily Architecture Discovery

on:
  schedule:
    # 00:30 UTC = 06:00 India Standard Time.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum results per ecosystem, Hacker News query, or RSS feed"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: daily-architecture-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCOVERY_LIMIT: ${{ github.event.inputs.limit || '10' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OAI
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Discover GitHub repositories
        run: oai discover github --limit "$DISCOVERY_LIMIT"
      - name: Discover Hacker News discussions
        run: oai discover hacker-news --limit "$DISCOVERY_LIMIT"
      - name: Discover RSS and Atom articles
        run: oai discover rss --limit "$DISCOVERY_LIMIT"
      - name: Generate daily trend report
        run: oai report trends --period daily
      - name: Generate rolling weekly trend report
        run: oai report trends --period weekly
      - name: Assess observation evidence
        run: oai assess evidence

      - name: Generate claim review queue
        run: oai claims review-queue
      - name: Commit observations, reports, and assessments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations/ reports/
          if git diff --cached --quiet; then
            echo "No new observations or reports to commit."
          else
            git commit -m "data: update observations and intelligence reports"
            git push
          fi
