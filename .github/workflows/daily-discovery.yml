name: Daily Architecture Discovery

on:
  schedule:
    # 00:30 UTC = 06:00 India Standard Time.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum results per ecosystem, Hacker News query, or RSS feed"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: daily-architecture-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OAI
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          oai discover all --limit "$LIMIT"
      - name: Commit new observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations/
          if git diff --cached --quiet; then
            echo "No new observations to commit."
          else
            git commit -m "data: update architecture observations"
            git push
          fi
