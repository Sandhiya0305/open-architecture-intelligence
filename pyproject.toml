[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-architecture-intelligence"
version = "0.1.0"
description = "Tools for collecting and reviewing software architecture source data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sandhiya0305" }]
dependencies = ["PyYAML>=6.0", "jsonschema[format]>=4.22", "defusedxml>=0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
oai = "oai_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oai_intelligence = ["resources/config/*.yaml", "resources/schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.uv]
required-version = ">=0.12.11,<0.14"
