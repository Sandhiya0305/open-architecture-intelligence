[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-architecture-intelligence"
version = "0.1.0"
description = "Evidence-first software architecture discovery and knowledge maintenance engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet selected" }
authors = [{ name = "Open Architecture Intelligence contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
oai = "oai_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
